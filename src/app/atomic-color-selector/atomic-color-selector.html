<div class="color-picker">
  <p>Choisir une couleur de thème :</p>

  <div class="swatches">
    <!-- ERREUR : Pas de bouton radio, pas de focus, pas de label -->
    @for (color of colors; track color.name) {
    <input type=radio [aria-label]="color.name"
      class="swatch-card"
      [attr.data-bg]="color.hex"
      (click)="selectColor(color)"
      [class.active]="selectedColor === color"
    >
    }
  </div>
</div>
